name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: jdx/mise-action@v3
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn format:check
      - run: yarn test
      - run: yarn typecheck
